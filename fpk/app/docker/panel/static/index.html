<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QQ 多开挂机 · 管理面板</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<!-- 登录 / 初始化 -->
<section id="auth-screen" class="auth-wrap hidden">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-mark"><span>Q</span><span>Q</span></div>
      <div>
        <h1>QQ 多开挂机</h1>
        <p class="muted">飞牛 NAS · 多账号常驻管理面板</p>
      </div>
    </div>
    <div id="auth-notice" class="notice hidden"></div>
    <h2 id="auth-title">登录</h2>
    <p id="auth-desc" class="muted small">请输入管理密码</p>
    <form id="auth-form">
      <label class="field">
        <span id="auth-label">管理密码</span>
        <input id="auth-password" type="password" autocomplete="current-password" required minlength="8" placeholder="至少 8 位">
      </label>
      <label class="field hidden" id="auth-confirm-field">
        <span>确认密码</span>
        <input id="auth-confirm" type="password" autocomplete="new-password" placeholder="再输入一次">
      </label>
      <button id="auth-submit" class="btn primary block" type="submit">登录</button>
    </form>
    <p class="muted tiny auth-foot">密码以 PBKDF2 加盐哈希保存在应用数据卷中，不会明文存储。</p>
  </div>
</section>

<!-- 主界面 -->
<section id="main-screen" class="hidden">
  <header class="topbar">
    <div class="brand compact">
      <div class="brand-mark small"><span>Q</span><span>Q</span></div>
      <div>
        <h1>QQ 多开挂机</h1>
        <p class="muted tiny" id="header-sub">飞牛 NAS 应用</p>
      </div>
    </div>
    <div class="top-actions">
      <span id="docker-badge" class="badge">检查中</span>
      <button class="btn ghost" id="btn-settings" title="设置">设置</button>
      <button class="btn ghost" id="btn-logout" title="退出登录">退出</button>
    </div>
  </header>

  <main class="container">
    <div class="summary">
      <div class="stat"><span class="stat-label">账号总数</span><strong id="stat-total">0</strong></div>
      <div class="stat"><span class="stat-label">运行中</span><strong id="stat-running" class="green">0</strong></div>
      <div class="stat"><span class="stat-label">已停止</span><strong id="stat-stopped" class="amber">0</strong></div>
      <div class="stat"><span class="stat-label">容器缺失</span><strong id="stat-missing" class="red">0</strong></div>
    </div>

    <div id="image-banner" class="banner hidden">
      <div>
        <strong id="image-title">QQ 客户端镜像</strong>
        <p class="muted small" id="image-desc"></p>
      </div>
      <button class="btn primary" id="btn-pull">拉取镜像</button>
    </div>

    <div id="alert" class="alert hidden"></div>

    <div class="toolbar">
      <div>
        <h2>我的 QQ</h2>
        <p class="muted small" id="port-hint">网页桌面端口范围：-</p>
      </div>
      <div class="toolbar-actions">
        <label class="switch-label"><input type="checkbox" id="auto-refresh" checked><span>自动刷新</span></label>
        <button class="btn ghost" id="btn-refresh">刷新</button>
        <button class="btn primary" id="btn-add">＋ 新增账号</button>
      </div>
    </div>

    <div id="accounts" class="grid"></div>

    <div id="empty" class="empty hidden">
      <div class="empty-icon">＋</div>
      <h3>还没有挂任何 QQ</h3>
      <p class="muted">点「新增账号」创建第一个实例，然后用浏览器扫码登录即可常驻在线。</p>
      <button class="btn primary" id="btn-add-empty">新增账号</button>
    </div>

    <footer class="foot muted tiny">
      每个账号一个独立容器与独立登录数据卷 · 数据保存在 Docker 卷中，卸载应用不会自动删除 · 本应用为第三方工具，与腾讯无关
    </footer>
  </main>
</section>

<!-- 通用弹窗 -->
<div id="modal-root" class="modal-root hidden">
  <div class="modal-backdrop" id="modal-backdrop"></div>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h3 id="modal-title">标题</h3>
      <button class="icon-btn" id="modal-close" aria-label="关闭">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-foot" id="modal-foot"></div>
  </div>
</div>

<div id="toasts" class="toasts"></div>

<script src="/static/app.js"></script>
</body>
</html>
