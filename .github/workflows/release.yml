name: Build and Release fpk

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build fpk
        run: python3 fnos-fpk/build-fpk.py

      - name: Resolve package info
        id: pkg
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version[[:space:]]*=[[:space:]]*//p' fnos-fpk/fpk-src/manifest | head -n1 | tr -d '\r')
          [ -n "$version" ] || { echo "manifest 缺少 version"; exit 1; }
          file="fnos-fpk/dist/qqnas_${version}_all.fpk"
          test -f "$file" || { echo "未生成 $file"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: qqnas-${{ steps.pkg.outputs.version }}-all
          path: ${{ steps.pkg.outputs.file }}
          if-no-files-found: error

      # 只有打 tag 时才发布 Release；普通 push 仅产出 workflow artifact。
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
          FILE: ${{ steps.pkg.outputs.file }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          sha=$(sha256sum "$FILE" | cut -d' ' -f1)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              echo "## QQ 挂机仓 ${VERSION}"
              echo
              echo "- 使用飞牛原生 Node.js 22 运行时，不依赖 Docker"
              echo "- 安装包见下方 Assets 中的 \`$(basename "$FILE")\`"
              echo
              echo "构建提交：${GITHUB_SHA}"
              echo
              echo "SHA-256：\`${sha}\`"
            } > /tmp/release-notes.md
            gh release create "$TAG" --title "QQ 挂机仓 ${VERSION}" --notes-file /tmp/release-notes.md
          fi
          gh release upload "$TAG" "$FILE" --clobber
