name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  fpk:
    name: 构建 FPK 并发布
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 源码校验
        run: python tools/build-native-check.py

      - name: 构建在线补齐包
        run: bash tools/build-native.sh --online

      - name: 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.fpk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
