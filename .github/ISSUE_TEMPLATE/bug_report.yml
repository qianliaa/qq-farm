name: 问题反馈
description: 报告安装、图形栈、扫码或面板异常
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        提交前请先看 [常见问题](https://github.com/qianliaa/qq-farm/blob/main/docs/faq.md)，并确认已更新到最新版本。
  - type: input
    id: version
    attributes:
      label: 版本
      description: 面板「设置 → 版本与更新」里显示的版本号
      placeholder: 1.0.15
    validations:
      required: true
  - type: dropdown
    id: deploy
    attributes:
      label: 部署方式
      options:
        - 飞牛 fnOS 原生 FPK
        - Docker
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 设备与架构
      placeholder: 飞牛 fnOS 0.9.x / N100 x86_64，内存 16GB
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: 环境准备日志或账号日志（`logs/<ID>.log`），注意去掉隐私信息
      render: text
